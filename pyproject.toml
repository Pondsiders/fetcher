[project]
name = "fetcher"
version = "0.1.0"
description = "Turn a URL into something an AI agent can read, or say loudly why not."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jeffery Harrell" },
    { name = "Alpha", email = "alphafornow@agentmail.to" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
fetcher = "fetcher.cli:main"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"__main__.py" = ["D100"]
"tests/**" = ["S101", "D100", "D101", "D102", "D103"]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportExplicitAny = false
reportAny = false
